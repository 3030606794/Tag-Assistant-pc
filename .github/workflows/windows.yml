name: Windows offline preview

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare offline runtime and branding
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0 fonttools==4.60.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/prepare_resources.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $wixBins = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { Join-Path $_.FullName 'bin' }
          foreach ($wixBin in $wixBins) { $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Core regression and desktop tests
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :engine:test :desktop:test
          exit $LASTEXITCODE
      - name: Actual Compose desktop previews
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :desktop:cloudPreview
          exit $LASTEXITCODE
      - name: Package Windows offline application
        shell: pwsh
        run: |
          $env:JAVA_TOOL_OPTIONS = "$env:JAVA_TOOL_OPTIONS -Dfile.encoding=UTF-8".Trim()
          .\gradlew.bat --no-daemon :desktop:createDistributable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/package_windows.ps1 -Version '0.1.2' -ApplicationName 'EPLAN标签助手'
      - name: Verify Chinese installer resources
        shell: pwsh
        run: |
          python scripts/verify_windows_installer.py --version '0.1.2' --application-name 'EPLAN标签助手'
          exit $LASTEXITCODE
      - name: Packaged application offline smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = (Resolve-Path 'desktop/build/compose/binaries/main/app/EPLAN标签助手').Path
          $previews = (Resolve-Path 'desktop/build/previews').Path
          Get-ChildItem -LiteralPath (Join-Path $image 'app') -Filter '*.cfg' | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $previews ('launcher-' + $_.Name))
          }
          Get-ChildItem -LiteralPath $image | Select-Object Name, Length, Mode | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $previews 'launcher-files.json') -Encoding utf8
          $fixture = (Resolve-Path 'engine/src/test/resources/fixtures/layout-cabinet-native.pdf').Path
          function Invoke-PackagedCheck([string]$ImageDirectory, [string]$ReportName) {
            $app = Join-Path $ImageDirectory 'EPLAN标签助手.exe'
            $outDir = Join-Path $env:RUNNER_TEMP ("eplan-pc-smoke/中文离线检查-$ReportName")
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            $stdout = Join-Path $previews "$ReportName-stdout.txt"
            $stderr = Join-Path $previews "$ReportName-stderr.txt"
            $process = Start-Process -FilePath $app -ArgumentList @('--smoke-test', ('"' + $outDir + '"'), ('"' + $fixture + '"')) -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (!$process.WaitForExit(240000)) {
              $process.Kill($true)
              throw "Packaged application timed out: $ReportName"
            }
            $process.WaitForExit()
            $errorFile = Join-Path $outDir 'smoke-error.txt'
            if (Test-Path -LiteralPath $errorFile) {
              Copy-Item -LiteralPath $errorFile -Destination (Join-Path $previews "$ReportName-error.txt")
            }
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $stdout, $stderr
              Get-Content -LiteralPath $errorFile -ErrorAction SilentlyContinue
              throw "Packaged application failed ($($process.ExitCode)): $ReportName"
            }
            $report = Join-Path $outDir 'smoke-result.json'
            if (!(Test-Path -LiteralPath $report)) { throw "Packaged application did not create the smoke report: $ReportName" }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if (!$result.ok -or $result.version -ne '0.1.2' -or $result.checks.Count -ne 11) {
              throw "Packaged application reported incomplete checks: $ReportName"
            }
            Copy-Item -LiteralPath $report -Destination (Join-Path $previews "$ReportName.json")
            Get-Content -LiteralPath $report
          }
          $previousDebug = $env:JPACKAGE_DEBUG
          try {
            $env:JPACKAGE_DEBUG = 'true'
            Invoke-PackagedCheck -ImageDirectory $image -ReportName 'smoke-result'
            $relocatedParent = Join-Path $env:RUNNER_TEMP '中文便携测试'
            New-Item -ItemType Directory -Force -Path $relocatedParent | Out-Null
            $relocated = Join-Path $relocatedParent 'EPLAN标签助手 便携版'
            Copy-Item -LiteralPath $image -Destination $relocated -Recurse
            Invoke-PackagedCheck -ImageDirectory $relocated -ReportName 'smoke-relocated-result'
          } finally {
            if ($null -eq $previousDebug) { Remove-Item Env:JPACKAGE_DEBUG -ErrorAction SilentlyContinue }
            else { $env:JPACKAGE_DEBUG = $previousDebug }
          }
      - name: Prepare delivery and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'delivery' | Out-Null
          Copy-Item 'desktop/build/compose/binaries/main/exe/*.exe' 'delivery/EPLAN标签助手-v0.1.2-安装版.exe'
          Copy-Item 'desktop/build/compose/binaries/main/msi/*.msi' 'delivery/EPLAN标签助手-v0.1.2.msi'
          Compress-Archive -Path 'desktop/build/compose/binaries/main/app/EPLAN标签助手' -DestinationPath 'delivery/EPLAN标签助手-v0.1.2-便携版.zip'
          Copy-Item 'README.md','LICENSE' 'delivery'
          $hashes = Get-ChildItem delivery -File | Where-Object { $_.Extension -in '.exe','.msi','.zip' } | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower() + '  ' + $_.Name }
          $hashes | Set-Content -Path 'delivery/SHA256SUMS.txt' -Encoding utf8
          Get-Content 'delivery/SHA256SUMS.txt'
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PC-v0.1.2-cloud-evidence
          path: |
            engine/build/reports/tests/
            engine/build/test-results/
            desktop/build/reports/tests/
            desktop/build/test-results/
            desktop/build/previews/
          if-no-files-found: warn
      - name: Upload Windows delivery
        uses: actions/upload-artifact@v4
        with:
          name: EplanTagAssistantPC-v0.1.2-Windows-x64
          path: delivery/
          if-no-files-found: error
